<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Panel — CODE & CLASSROOM</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/css/admin.css"></head><body><div class="admin-layout"><aside class="admin-sidebar"><div class="admin-logo">C&amp;C Admin</div><nav><div class="admin-nav"><button class="active" data-section="dashboard"><i class="fas fa-chart-simple"></i> Dashboard</button><button data-section="categories"><i class="fas fa-folder-tree"></i> Categories</button><button data-section="projects"><i class="fas fa-code"></i> Projects</button><button data-section="materials"><i class="fas fa-file-lines"></i> Materials</button><button data-section="messages"><i class="fas fa-envelope"></i> Messages</button><button data-section="downloads"><i class="fas fa-download"></i> Downloads</button></div><div class="admin-nav admin-nav-bottom"><button id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</button></div></nav></aside><main class="admin-main"><section class="admin-section active" id="sec-dashboard"><div class="section-header"><h2>Dashboard</h2></div><div class="stats-grid" id="dashboardStats"></div><div class="section-header" style="margin-top:24px"><h2>Recent Materials</h2></div><table><thead><tr><th>Title</th><th>Category</th><th>Type</th><th>Date</th></tr></thead><tbody id="recentMaterialsBody"></tbody></table></section><section class="admin-section" id="sec-categories"><div class="section-header"><h2>Categories</h2><button class="btn btn-primary"
